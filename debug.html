<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEBUG Labirin</title>
<link rel="stylesheet" href="style.css">
<style>
#errlog{position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a1111;color:#fff;font:12px/1.4 monospace;padding:6px;white-space:pre-wrap;max-height:45vh;overflow:auto;display:none}
</style>
<script>
window.__errs = [];
function showErrs() {
  var el = document.getElementById('errlog');
  if (!el) return;
  if (window.__errs.length) {
    el.style.display = 'block';
    el.textContent = window.__errs.join('\n\n');
  }
}
window.onerror = function (msg, src, line, col, err) {
  window.__errs.push('ERROR: ' + msg + '\n  at ' + src + ':' + line + ':' + col + (err && err.stack ? '\n  ' + err.stack : ''));
  showErrs();
  return false;
};
window.addEventListener('unhandledrejection', function (e) {
  window.__errs.push('UNHANDLED REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  showErrs();
});
</script>
</head>
<body>
<div id="errlog"></div>
<main id="app">
  <h1>🚪 Labirin Penguasa TKA</h1>
  <div id="hud"></div>
  <div id="comp"></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="pad"><button data-d="N">▲</button><button data-d="W">◀</button><button data-d="S">▼</button><button data-d="E">▶</button></div>
  <p class="hint">Panah / WASD / tombol layar / geser jari. Setiap jalur melewati pintu soal.</p>
</main>
<div id="ov" class="ov"><div class="card" id="ovc"></div></div>

<script src="js/util.js"></script>
<script src="js/questions.js"></script>
<script src="js/maze.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var state = {
      ovClass: document.getElementById('ov').className,
      ovcHtmlLen: document.getElementById('ovc').innerHTML.length,
      ovcHtmlHead: document.getElementById('ovc').innerHTML.slice(0, 200),
      hudLen: document.getElementById('hud').innerHTML.length,
      errs: window.__errs
    };
    document.title = 'STATE ' + JSON.stringify(state);
    if (window.__errs.length) showErrs();
  }, 500);
});
</script>
</body>
</html>
